<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: "TrueScoped" }}</title>
  <meta name="description" content="{{ page.desc | default: 'Free, useful answers to everyday tech problems.' }}">
  <link rel="canonical" href="{{ page.canonical | default: page.url | absolute_url }}">
  <style>
    body { font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #202223; background: #f7f8f9; margin: 0; }
    header.site { background: #33434b; color: #fff; padding: 14px 24px; }
    header.site a { color: #fff; text-decoration: none; }
    .container { max-width: 960px; margin: 0 auto; padding: 0 24px; }
    .ad-row { display: flex; justify-content: center; padding: 12px 0; }
    article { background: #fff; border: 1px solid #d8dadd; border-radius: 8px; padding: 32px 28px; margin: 24px 0; }
    article h1 { color: #33434b; margin: 0 0 12px; font-size: 28px; }
    article h2 { color: #33434b; margin: 24px 0 6px; font-size: 20px; }
    article h3 { color: #1f6c93; margin: 18px 0 6px; font-size: 16px; }
    article p { margin: 0 0 12px; }
    article ul, article ol { margin: 0 0 12px 22px; }
    article li { margin: 0 0 4px; }
    article table { border-collapse: collapse; margin: 12px 0; }
    article th, article td { border: 1px solid #d8dadd; padding: 6px 10px; text-align: left; font-size: 14px; }
    article th { background: #33434b; color: #fff; }
    article pre { background: #f1f3f5; padding: 12px; border-radius: 4px; overflow-x: auto; }
    article code { font-family: "SF Mono", Menlo, Monaco, Consolas, monospace; font-size: 14px; }
    footer.site { background: #1d2428; color: #aaa; padding: 20px 0; text-align: center; font-size: 13px; }
    footer.site a { color: #ddd; margin: 0 8px; }
  </style>
</head>
<body>
<header class="site">
  <div class="container">
    <a href="/"><strong>TrueScoped</strong></a>
  </div>
</header>
<div class="container">

  <div class="ad-row"><div data-ad="728x90"></div></div>

  <article>
    {{ content }}
  </article>

  <div class="ad-row"><div data-ad="468x60"></div></div>

</div>
<footer class="site">
  <div class="container">
    <a href="/about/">About</a>
    <a href="/privacy/">Privacy</a>
    <a href="/contact/">Contact</a>
    <p style="margin:12px 0 0;">&copy; 2026 TrueScoped</p>
  </div>
</footer>
<script src="/ads/ads.js" defer></script>
</body>
</html>
